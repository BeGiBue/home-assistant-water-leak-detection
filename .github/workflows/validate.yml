name: Validate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "https://github.com/home-assistant/core/archive/refs/tags/2026.9.4.zip"
          # HA scans namespace paths as real directories; avoid editable finder sentinels.
          python -m pip install ".[test]"
          python -m pip install ruff
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/water_leak_detection/manifest.json >/dev/null
          python -m json.tool custom_components/water_leak_detection/translations/en.json >/dev/null
          python -m json.tool custom_components/water_leak_detection/translations/de.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Check card syntax
        run: node --check custom_components/water_leak_detection/frontend/water-leak-guard-card.js
      - name: Card logic tests (plain Node, no npm packages)
        run: node tests/card/card_logic.test.mjs
      - name: Compile
        run: python -m compileall -q custom_components tests
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: TEMP failure details
        if: always()
        run: |
          pytest -q -p no:cacheprovider -x -q --tb=short tests/test_f04_fsr_h01.py > /tmp/one.txt 2>&1 || true
          pytest -q -p no:cacheprovider --tb=line > /tmp/all.txt 2>&1 || true
          python - <<'PY'
          one = open("/tmp/one.txt").read()
          lines = [l for l in open("/tmp/all.txt").read().splitlines() if l.startswith(("FAILED", "ERROR", "/")) or " passed" in l or " failed" in l]
          t = one[-5000:] + "\n==ALL==\n" + "\n".join(lines)[-5000:]
          print("::error::" + t.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
      - name: TEMP mutation check
        if: always()
        run: python .github/tmp/mutations.py
