start_high_flow_bypass:
  name: Start high-flow bypass
  description: Temporarily suppress only High Flow detection. Burst Leak stays active.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional when only one Water Leak Guard instance is configured.
      required: false
      selector:
        text:
    duration_minutes:
      name: Duration
      description: Bypass duration. If omitted, the configured default is used.
      required: false
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min

cancel_high_flow_bypass:
  name: Cancel high-flow bypass
  description: Re-enable High Flow detection immediately.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional when only one Water Leak Guard instance is configured.
      required: false
      selector:
        text:

reset_learning:
  name: Reset adaptive learning
  description: Clears all admitted normal-flow learning samples. Detector settings and active leak events are not reset.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional when only one Water Leak Guard instance is configured.
      required: false
      selector:
        text:

external_reset:
  name: external reset
  description: Requires current event bindings and Home authorization. Never opens a valve.
  fields:
    action_kind:
      required: true
      selector:
        text:
    config_entry_id:
      required: true
      selector:
        text:
    source_id:
      required: true
      selector:
        text:
    source_generation:
      required: true
      selector:
        text:
    event_id:
      required: true
      selector:
        text:
    recipient_id:
      required: true
      selector:
        text:
    recipient_token:
      required: true
      selector:
        text:
    reset_nonce:
      required: true
      selector:
        text:

request_external_reset_action:
  name: request external reset action
  description: Requires current event bindings and Home authorization. Never opens a valve.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    source_id:
      required: true
      selector:
        text:
    recipient_id:
      required: true
      selector:
        text:
